name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      run_external_llm_eval:
        description: "Executar smoke test com LLM externo?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 1 - Lint com Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar Ruff check
        run: |
          ruff check .

      - name: Verificar formatação com Ruff
        run: |
          ruff format --check .

  type-check:
    name: 2 - Type Check com MyPy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar MyPy
        run: |
          mypy calculator_api

  test:
    name: 3 - Testes e Coverage
    runs-on: ubuntu-latest
    needs: type-check

    env:
      LLM_PROVIDER: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes com coverage
        run: |
          pytest --cov=calculator_api --cov-report=term-missing --cov-report=xml

      - name: Upload do coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: 4 - Security Scan com Bandit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar Bandit
        run: |
          bandit -r calculator_api

  build-docker:
    name: 5 - Build Docker
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build -t calculator-api:${{ github.sha }} .
          docker tag calculator-api:${{ github.sha }} calculator-api:ci

      - name: Verificar imagens criadas
        run: |
          docker images

      - name: Salvar imagem Docker como arquivo
        run: |
          docker save calculator-api:ci -o calculator-api-image.tar

      - name: Upload da imagem Docker como artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-api-image
          path: calculator-api-image.tar

  deploy-dev-and-quality:
    name: 6 - Deploy DEV Simulado + Smoke + LLM Quality
    runs-on: ubuntu-latest
    needs: build-docker
    environment:
      name: dev

    env:
      LLM_PROVIDER: local
      API_BASE_URL: http://127.0.0.1:8000
      MINIMUM_REQUIRED_ACCURACY: "1.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download da imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: calculator-api-image

      - name: Listar arquivos baixados
        run: |
          ls -lah

      - name: Carregar imagem Docker
        run: |
          docker load -i calculator-api-image.tar

      - name: Verificar imagens disponíveis
        run: |
          docker images

      - name: Subir container da API
        run: |
          docker run -d \
            --name calculator-api-dev \
            -p 8000:8000 \
            -e LLM_PROVIDER="${LLM_PROVIDER}" \
            calculator-api:ci

      - name: Verificar status inicial do container
        run: |
          docker ps -a
          docker logs calculator-api-dev || true

      - name: Aguardar API responder no /health
        run: |
          for i in {1..30}; do
            echo "Tentativa $i/30..."
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API respondeu com sucesso."
              exit 0
            fi

            echo "API ainda não respondeu. Status do container:"
            docker ps -a
            echo "Logs atuais:"
            docker logs calculator-api-dev || true
            sleep 2
          done

          echo "API não respondeu após 60 segundos."
          docker ps -a
          docker logs calculator-api-dev || true
          exit 1

      - name: Smoke test do endpoint /ask-math
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/ask-math \
            -H "Content-Type: application/json" \
            -d '{"question":"Quanto é 2 + 2?"}'

      - name: Executar qualidade LLM via API Dockerizada
        run: |
          python scripts/evaluate_math_api.py

      - name: Upload do relatório de qualidade LLM via API
        uses: actions/upload-artifact@v4
        with:
          name: llm-api-quality-report
          path: llm_api_quality_report.json

      - name: Encerrar container
        if: always()
        run: |
          docker logs calculator-api-dev || true
          docker stop calculator-api-dev || true
          docker rm calculator-api-dev || true

  external-llm-smoke:
    name: 7 - Smoke Opcional com LLM Externo
    runs-on: ubuntu-latest
    needs: build-docker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_llm_eval == 'true' }}
    environment:
      name: dev

    env:
      LLM_PROVIDER: openai-compatible
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - name: Download da imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: calculator-api-image

      - name: Carregar imagem Docker
        run: |
          docker load -i calculator-api-image.tar

      - name: Subir container com LLM externo
        run: |
          docker run -d \
            --name calculator-api-external-llm \
            -p 8001:8000 \
            -e LLM_PROVIDER="${LLM_PROVIDER}" \
            -e LLM_API_KEY="${LLM_API_KEY}" \
            -e LLM_BASE_URL="${LLM_BASE_URL}" \
            -e LLM_MODEL="${LLM_MODEL}" \
            calculator-api:ci

      - name: Aguardar API externa responder no /health
        run: |
          for i in {1..30}; do
            echo "Tentativa $i/30..."
            if curl -fsS http://127.0.0.1:8001/health; then
              echo "API respondeu com sucesso."
              exit 0
            fi

            docker ps -a
            docker logs calculator-api-external-llm || true
            sleep 2
          done

          echo "API externa não respondeu após 60 segundos."
          docker ps -a
          docker logs calculator-api-external-llm || true
          exit 1

      - name: Smoke test do endpoint /ask-math com LLM externo
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/ask-math \
            -H "Content-Type: application/json" \
            -d '{"question":"Quanto é 2 + 2?"}'

      - name: Encerrar container externo
        if: always()
        run: |
          docker logs calculator-api-external-llm || true
          docker stop calculator-api-external-llm || true
          docker rm calculator-api-external-llm || true