name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versão do Python usada na pipeline"
        required: false
        type: string
        default: "3.12"

      working-directory:
        description: "Diretório raiz do projeto Python"
        required: false
        type: string
        default: "."

      run-security-scan:
        description: "Executar análise de segurança com Bandit"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pyproject.toml

      - name: Upgrade pip
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          python -m pip install --upgrade pip

      - name: Install project with dev dependencies
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          python -m pip install -e ".[dev]"

      - name: Check formatting with Ruff
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          ruff format --check .

      - name: Lint with Ruff
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          ruff check .

      - name: Type check with MyPy
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          mypy src

      - name: Run tests with coverage
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Security scan with Bandit
        if: ${{ inputs.run-security-scan }}
        shell: bash
        run: |
          cd "${{ inputs.working-directory }}"
          bandit -r src