[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator_api"
version = "0.1.0"
description = "Template Python com FastAPI, testes e GitHub Actions reutilizável"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Abigail", email = "abigail.lopes@optdriven.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "bandit>=1.7.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=calculator_api",
    "--cov-report=term-missing"
]

[tool.coverage.run]
branch = true
source = [
    "calculator_api"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

plugins = []